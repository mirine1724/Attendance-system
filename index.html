
<!DOCTYPE html>
<html>
  <head>
    <title>출결 페이지</title>
  </head>
  <body>
    <h2>출결 시스템</h2>
    <p>이름: <span id="name"></span></p>
    <button id="checkinBtn">✅ 출석하기</button>
    <button id="absentBtn">📝 결석 사유서 제출</button>

    <div id="absentForm" style="display:none;">
      <h3>결석 사유서</h3>
      날짜: <input type="date" id="date"><br><br>
      사유:<br>
      <textarea id="reason" rows="4" cols="40"></textarea><br><br>
      <button id="submitAbsent">제출</button>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get("name") || "이름없음";
      const id = urlParams.get("id") || "noid";

      document.getElementById("name").textContent = name;

      document.getElementById("checkinBtn").addEventListener("click", () => {
        fetch("https://script.google.com/macros/s/YOUR_CHECKIN_SCRIPT_ID/exec", {
          method: "POST",
          body: JSON.stringify({ name, id, time: new Date().toISOString() }),
          headers: { "Content-Type": "application/json" }
        }).then(() => {
          alert("✅ 출석 완료!");
        });
      });

      document.getElementById("absentBtn").addEventListener("click", () => {
        document.getElementById("absentForm").style.display = "block";
      });

      document.getElementById("submitAbsent").addEventListener("click", () => {
        const reason = document.getElementById("reason").value;
        const date = document.getElementById("date").value;
        fetch("https://script.google.com/macros/s/YOUR_ABSENT_SCRIPT_ID/exec", {
          method: "POST",
          body: JSON.stringify({ name, id, date, reason }),
          headers: { "Content-Type": "application/json" }
        }).then(() => {
          alert("📝 결석 사유서 제출 완료!");
        });
      });
    </script>
  </body>
</html>
